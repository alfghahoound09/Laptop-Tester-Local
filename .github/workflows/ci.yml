name: CI Build & Test

on:
  push:
    branches: [master, main, dev]
  pull_request:
    branches: [master, main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore LaptopTester.sln

      - name: Build solution (Release)
        run: dotnet build LaptopTester.sln -c Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test tests/LaptopTester.Tests/LaptopTester.Tests.csproj
          -c Release
          --no-build
          --filter "Category!=Hardware&Category!=Audible"
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory TestResults

      - name: Publish portable preview executable
        shell: pwsh
        run: .\scripts\build-release.ps1 -SkipTests -SkipInstaller

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload portable preview exe
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: LaptopTester-preview-win-x64
          path: |
            dist/*-portable.exe
            dist/SHA256SUMS.txt
          retention-days: 14
