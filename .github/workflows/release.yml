name: Release & Patch Publisher

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type (when triggered manually)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
          - custom
      custom_version:
        description: 'Custom semantic version (only used if bump_type=custom, e.g. 1.2.3)'
        required: false
        default: ''
        type: string
      prerelease:
        description: 'Mark GitHub Release as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve or bump version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $bump = '${{ inputs.bump_type }}'
            $custom = '${{ inputs.custom_version }}'
            if ($bump -eq 'custom') {
              .\scripts\bump-version.ps1 -Bump custom -CustomVersion $custom
            }
            else {
              [xml]$props = Get-Content -Raw 'Directory.Build.props'
              $cur = (($props.Project.PropertyGroup.Version | Select-Object -First 1).Trim() -split '-')[0]
              $tags = git tag -l 'v*' | ForEach-Object { $_ -replace '^v', '' } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
              $highest = [version]$cur
              foreach ($t in $tags) {
                $tv = [version]$t
                if ($tv -gt $highest) { $highest = $tv }
              }
              $props.Project.PropertyGroup.Version = $highest.ToString()
              $props.Save((Resolve-Path 'Directory.Build.props').Path)
              .\scripts\bump-version.ps1 -Bump $bump
            }

            [xml]$updated = Get-Content -Raw 'Directory.Build.props'
            $ver = ($updated.Project.PropertyGroup.Version | Select-Object -First 1).Trim()
            $tag = "v$ver"

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Directory.Build.props
            git diff --cached --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "chore(release): $tag"
              git push origin HEAD:${{ github.ref_name }}
            }
            git tag -a $tag -m "Release $tag"
            git push origin $tag

            $isPre = ('${{ inputs.prerelease }}' -eq 'true') -or ($ver -match '-')
          }
          else {
            $tag = '${{ github.ref_name }}'
            $ver = $tag.TrimStart('v')
            $isPre = $ver -match '-'
          }

          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$($isPre.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Releasing version $ver (tag: $tag, prerelease: $isPre)"

      - name: Ensure Inno Setup is installed
        shell: pwsh
        run: |
          $found = (Get-Command iscc -ErrorAction SilentlyContinue) -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 7\ISCC.exe") -or
            (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -or
            (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not $found) {
            choco install innosetup -y --no-progress
          }

      - name: Test, publish portable .exe and build Windows installer .exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ steps.version.outputs.version }}'
          .\scripts\build-release.ps1 -Version $ver
          $setup = Get-ChildItem -Path dist -Filter "LaptopTester-Setup-$ver-win-x64.exe"
          $portable = Get-ChildItem -Path dist -Filter "LaptopTester-$ver-win-x64-portable.exe"
          if (-not $setup -or -not $portable) {
            throw "Expected both Setup and Portable .exe artifacts in dist/."
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $repo = '${{ github.repository }}'
          $tag = '${{ steps.version.outputs.tag }}'
          $title = "LaptopTester $tag"
          $isPre = '${{ steps.version.outputs.prerelease }}' -eq 'true'

          $files = @(
            @(
              (Get-ChildItem -Path dist -Filter 'LaptopTester-Setup-*.exe' | Select-Object -ExpandProperty FullName)
              (Get-ChildItem -Path dist -Filter 'LaptopTester-*-portable.exe' | Select-Object -ExpandProperty FullName)
              (Resolve-Path 'dist/SHA256SUMS.txt').Path
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )

          if ($files.Count -lt 3) {
            throw "Expected Setup .exe, Portable .exe, and SHA256SUMS.txt in dist/ (found $($files.Count))."
          }

          gh release view $tag --repo $repo *> $null
          $releaseExists = ($LASTEXITCODE -eq 0)

          if (-not $releaseExists) {
            Write-Host "Creating GitHub Release $tag..."
            $createArgs = @('release', 'create', $tag, '--repo', $repo, '--title', $title, '--generate-notes')
            if ($isPre) { $createArgs += '--prerelease' }
            & gh @createArgs
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create GitHub Release $tag."
            }
          }

          Write-Host "Uploading GitHub Release $tag assets (binaries first, SHA256SUMS.txt last)..."
          foreach ($file in $files) {
            $fileName = Split-Path -Leaf $file
            $uploaded = $false
            for ($attempt = 1; $attempt -le 5; $attempt++) {
              Write-Host "Uploading $fileName (attempt $attempt/5)..."
              & gh release upload $tag $file --repo $repo --clobber
              if ($LASTEXITCODE -eq 0) {
                $uploaded = $true
                break
              }
              Write-Warning "Upload failed for $fileName (attempt $attempt/5, exit $LASTEXITCODE); retrying..."
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $uploaded) {
              throw "Failed to upload $fileName for $tag after 5 attempts."
            }
          }
